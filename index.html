<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#030712" />
  <title>PRScam • Ultra Surveillance & Thermal Guard</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #030712;
      --panel: rgba(15, 23, 42, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00f0ff;
      --cyan-glow: 0 0 16px rgba(0, 240, 255, 0.4);
      --emerald: #10b981;
      --emerald-glow: 0 0 16px rgba(16, 185, 129, 0.4);
      --danger: #ef4444;
      --danger-glow: 0 0 16px rgba(239, 68, 68, 0.4);
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif; }
    
    body {
      background: radial-gradient(circle at 50% 0%, #0d1527 0%, var(--bg) 75%);
      color: var(--text);
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 10px 16px;
    }

    .top-deck {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 8px;
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      font-size: 1.25rem; font-weight: 900; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 8px;
    }
    .status-beacon {
      width: 9px; height: 9px; border-radius: 50%; background: var(--emerald);
      box-shadow: var(--emerald-glow); animation: radarPulse 2s infinite;
    }
    @keyframes radarPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }

    .telemetry-strip { display: flex; gap: 8px; align-items: center; }
    .chip {
      background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 4px 10px;
      border-radius: 8px; font-size: 0.75rem; font-family: monospace; color: var(--text-dim);
      display: flex; align-items: center; gap: 6px;
    }
    .chip b { color: var(--cyan); }

    .mode-switch {
      display: flex; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
      border-radius: 10px; padding: 3px;
    }
    .mode-btn {
      padding: 6px 14px; border: none; border-radius: 7px; background: transparent;
      color: var(--text-dim); font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff; box-shadow: 0 2px 10px rgba(37,99,235,0.4);
    }

    .main-stage {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      position: relative; border-radius: 16px; overflow: hidden; background: #000;
      border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .video-surface {
      width: 100%; height: 100%; object-fit: contain; transform-origin: center center;
      cursor: grab; user-select: none;
    }
    .video-surface:active { cursor: grabbing; }

    .hud-header {
      position: absolute; top: 12px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }
    .hud-tag {
      background: rgba(3, 7, 18, 0.75); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12); padding: 4px 10px;
      border-radius: 6px; font-size: 0.75rem; font-family: monospace;
    }
    .rec-flag { color: var(--danger); font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .rec-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .cc-ticker {
      position: absolute; bottom: 14px; left: 10%; right: 10%;
      background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 240, 0, 0.3); padding: 8px 18px;
      border-radius: 12px; color: #ffe600; font-size: 0.95rem; font-weight: 700;
      text-align: center; z-index: 15; pointer-events: none; box-shadow: 0 4px 25px rgba(0,0,0,0.9);
    }

    .command-deck {
      background: var(--panel); backdrop-filter: blur(20px); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px 14px; margin-top: 8px; display: flex;
      flex-direction: column; gap: 8px;
    }

    .dock-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    .zoom-strip {
      flex: 1; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.4);
      padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border);
    }
    .zoom-strip input[type=range] { flex: 1; accent-color: var(--cyan); cursor: pointer; }
    .zoom-chip {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
    }
    .zoom-chip:hover { border-color: var(--cyan); color: var(--cyan); }

    .actions-strip { display: flex; gap: 8px; align-items: center; }
    
    .btn-act {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 9px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: #fff;
      font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .btn-act:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.2); }
    .btn-act:active { transform: translateY(0); }
    .btn-act.danger { background: linear-gradient(135deg, #ef4444, #b91c1c); border: none; box-shadow: var(--danger-glow); }
    .btn-act.accent { background: linear-gradient(135deg, #00f0ff, #0099ff); color: #000; font-weight: 800; border: none; box-shadow: var(--cyan-glow); }
    .btn-act.emerald { background: linear-gradient(135deg, #10b981, #059669); border: none; box-shadow: var(--emerald-glow); }

    select.act-select {
      background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--border);
      padding: 7px 10px; border-radius: 9px; font-size: 0.8rem; font-weight: 700; outline: none; cursor: pointer;
    }
    select.act-select:focus { border-color: var(--cyan); }

    #stealthHider {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000 !important; z-index: 2147483647; display: flex;
      flex-direction: column; align-items: center; justify-content: flex-end;
      padding-bottom: 25px; cursor: pointer;
    }
    #stealthHider p { color: #1e1e1e; font-size: 0.75rem; user-select: none; }
    .hidden { display: none !important; }

    .main-stage:fullscreen { width: 100vw; height: 100vh; border-radius: 0; border: none; }
  </style>
</head>
<body>

  <!-- 100% PITCH BLACK BATTERY SAVER -->
  <div id="stealthHider" class="hidden" onclick="exitStealth()">
    <p>⚡ PRScam Thermal Guard Active • Tap anywhere to wake</p>
  </div>

  <!-- TOP DECK -->
  <div class="top-deck">
    <div class="brand-group">
      <div class="brand-logo"><span class="status-beacon"></span> PRScam</div>
      <div class="telemetry-strip">
        <span class="chip">PROFILE: <b id="statRes">360p ECO</b></span>
        <span class="chip">ZOOM: <b id="statZoom">1.0x</b></span>
        <span class="chip">CLOCK: <b id="statClock">00:00:00</b></span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: center;">
      <input type="text" id="secretKey" value="prs-secure-cam-782" style="background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 5px 10px; border-radius: 8px; color:#fff; font-size: 0.8rem; width: 140px;" placeholder="Secret Key" />
      <div class="mode-switch">
        <button class="mode-btn" id="tabCam" onclick="switchMode('camera')">📱 Home Phone</button>
        <button class="mode-btn active" id="tabView" onclick="switchMode('viewer')">💻 Office Command</button>
      </div>
    </div>
  </div>

  <!-- STAGE: CCTV VIEWPORT -->
  <div class="main-stage" id="stageViewport" ondblclick="toggleFullscreen()">
    <div class="hud-header">
      <span class="hud-tag" id="hudStatus">STANDBY</span>
      <span class="hud-tag hidden rec-flag" id="recBadge"><span class="rec-dot"></span> REC <span id="recTimer">00:00</span></span>
    </div>

    <div class="cc-ticker hidden" id="ccTicker">💬 Listening for speech...</div>
    <video class="video-surface" id="liveVideo" autoplay playsinline></video>
  </div>

  <!-- COMMAND DECK (DOCK) -->
  <div class="command-deck">
    
    <!-- ROW 1: 100x ZOOM SLIDER -->
    <div class="dock-row">
      <div class="zoom-strip">
        <span style="font-size: 0.78rem; font-weight: 800; min-width: 80px; color:var(--cyan);">🔍 ZOOM <span id="zoomReadout">1.0x</span></span>
        <button class="zoom-chip" onclick="setZoom(1)">1x</button>
        <button class="zoom-chip" onclick="setZoom(5)">5x</button>
        <button class="zoom-chip" onclick="setZoom(10)">10x</button>
        <button class="zoom-chip" onclick="setZoom(25)">25x</button>
        <button class="zoom-chip" onclick="setZoom(50)">50x</button>
        <button class="zoom-chip" onclick="setZoom(100)">100x</button>
        <input type="range" id="zoomSlider" min="1" max="100" step="0.5" value="1" oninput="setZoom(this.value)" />
      </div>
    </div>

    <!-- ROW 2: ACTIONS & THERMAL CONTROLS -->
    <div class="dock-row">
      
      <!-- CONTROLS FOR OFFICE VIEWER -->
      <div class="actions-strip" id="viewerActions">
        <button class="btn-act accent" onclick="connectViewer()">⚡ Connect Live</button>
        <button class="btn-act danger" id="recBtn" onclick="toggleRecording()">🔴 Record</button>
        <button class="btn-act" onclick="captureZoomedSnapshot()">📸 Zoom Snap</button>
        <button class="btn-act" id="muteHearBtn" onclick="toggleHear()">🔊 Hear: ON</button>
        <button class="btn-act" id="talkBtn" onclick="toggleTalk()">🎙️ Talk: OFF</button>
        <button class="btn-act" onclick="remoteFlipCamera()">🔄 Flip Lens</button>
        
        <!-- REMOTE RESOLUTION & THERMAL SELECTOR -->
        <select class="act-select" id="remoteResSelect" onchange="remoteChangeQuality(this.value)">
          <optgroup label="❄️ Thermal Saver (Phone Thanda Rahega)">
            <option value="240">240p (Zero-Heat 15FPS)</option>
            <option value="360" selected>360p (Battery Saver)</option>
            <option value="480">480p (SD Balanced)</option>
          </optgroup>
          <optgroup label="🔥 High Definition (Inspection Mode)">
            <option value="720">720p HD</option>
            <option value="1080">1080p Full HD</option>
            <option value="4k">4K Ultra HD</option>
            <option value="8k">8K Cinema</option>
          </optgroup>
        </select>

        <button class="btn-act" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      </div>

      <!-- CONTROLS FOR PHONE BROADCASTER -->
      <div class="actions-strip hidden" id="cameraActions">
        <select class="act-select" id="phoneFacing">
          <option value="environment">Back Camera (Main)</option>
          <option value="user">Front Camera</option>
        </select>
        
        <!-- INITIAL QUALITY SELECTION -->
        <select class="act-select" id="initialQuality">
          <option value="360" selected>❄️ 360p (Battery & Cool Mode)</option>
          <option value="240">❄️ 240p (Zero-Heat Minimal)</option>
          <option value="480">480p (Standard)</option>
          <option value="720">720p (HD)</option>
          <option value="1080">1080p (Full HD)</option>
        </select>

        <select class="act-select" id="speechLang">
          <option value="hi-IN" selected>Hindi (हिन्दी STT)</option>
          <option value="en-IN">English (India)</option>
          <option value="en-US">English (US)</option>
        </select>
        <button class="btn-act emerald" onclick="startBroadcasting()">🚀 Start Camera</button>
        <button class="btn-act" onclick="enterStealth()">🔋 100% Black Screen</button>
      </div>

      <div style="font-size: 0.78rem; color: var(--text-dim);" id="systemMsg">Thermal Guard Active</div>
    </div>
  </div>

  <audio id="officeAudioSpeaker" autoplay></audio>

  <script>
    setInterval(() => {
      document.getElementById('statClock').textContent = new Date().toLocaleTimeString();
    }, 1000);

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
        ]
      }
    };

    let peer = null;
    let localStream = null;
    let officeMicStream = null;
    let dataChannel = null;

    let isHearActive = true;
    let isTalkActive = false;

    // 100x Zoom & Pan
    let zoomLevel = 1.0;
    let panX = 0, panY = 0;
    let isDragging = false;
    let startX, startY;

    // Recording State
    let mediaRecorder = null;
    let recordedBlobs = [];
    let isRecording = false;
    let recTimerInt = null;
    let recSeconds = 0;

    // Speech Recognition
    let recognition = null;
    let ccTimeout = null;

    // Camera Broadcaster State
    let currentFacing = 'environment';
    let currentQuality = '360'; // Default to Cool/Battery Saver mode!

    function switchMode(mode) {
      const isCam = mode === 'camera';
      document.getElementById('tabCam').classList.toggle('active', isCam);
      document.getElementById('tabView').classList.toggle('active', !isCam);
      document.getElementById('cameraActions').classList.toggle('hidden', !isCam);
      document.getElementById('viewerActions').classList.toggle('hidden', isCam);
    }

    // ==========================================
    // 100% BLACK SCREEN + GPU SLEEP
    // ==========================================
    async function enterStealth() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
      } catch (e) {}

      // Pause local video rendering to cool down mobile GPU!
      const vid = document.getElementById('liveVideo');
      vid.style.visibility = 'hidden';

      document.getElementById('stealthHider').classList.remove('hidden');
    }

    async function exitStealth() {
      try {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
      } catch (e) {}
      
      const vid = document.getElementById('liveVideo');
      vid.style.visibility = 'visible';

      document.getElementById('stealthHider').classList.add('hidden');
    }

    // ==========================================
    // THERMAL & BATTERY OPTIMIZED CONSTRAINTS
    // ==========================================
    function getConstraints(facing, quality) {
      let width = 640, height = 360, fps = 15; // Default 360p @ 15fps (Zero heat)

      if (quality === '240') {
        width = 426; height = 240; fps = 15;
      } else if (quality === '360') {
        width = 640; height = 360; fps = 15;
      } else if (quality === '480') {
        width = 854; height = 480; fps = 20;
      } else if (quality === '720') {
        width = 1280; height = 720; fps = 24;
      } else if (quality === '1080') {
        width = 1920; height = 1080; fps = 30;
      } else if (quality === '4k') {
        width = 3840; height = 2160; fps = 30;
      } else if (quality === '8k') {
        width = 7680; height = 4320; fps = 30;
      }

      return {
        video: {
          facingMode: facing,
          width: { ideal: width },
          height: { ideal: height },
          frameRate: { ideal: fps, max: fps } // Capping frame rate cools down the phone!
        },
        audio: { echoCancellation: true, noiseSuppression: true }
      };
    }

    async function startBroadcasting() {
      const key = document.getElementById('secretKey').value.trim();
      const statusEl = document.getElementById('systemMsg');
      currentFacing = document.getElementById('phoneFacing').value;
      currentQuality = document.getElementById('initialQuality').value;

      statusEl.textContent = `Booting ${currentQuality}p Camera (Thermal Optimized)...`;
      try {
        localStream = await navigator.mediaDevices.getUserMedia(getConstraints(currentFacing, currentQuality));
        
        const video = document.getElementById('liveVideo');
        video.srcObject = localStream;

        if ('wakeLock' in navigator) {
          try { await navigator.wakeLock.request('screen'); } catch(e){}
        }

        initAIPlayback();

        if (peer) peer.destroy();
        peer = new Peer(key, peerConfig);

        peer.on('open', () => {
          statusEl.textContent = `🟢 Broadcaster Live (${currentQuality}p Eco)!`;
          document.getElementById('hudStatus').textContent = `LIVE (${currentQuality.toUpperCase()}P ECO)`;
        });

        peer.on('connection', (conn) => {
          dataChannel = conn;
          statusEl.textContent = "🔵 Office Connected. Streaming...";
          
          conn.on('data', async (cmd) => {
            if (cmd.type === 'remote_flip') {
              currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
              await updateCameraStream();
            } else if (cmd.type === 'remote_quality') {
              currentQuality = cmd.quality;
              await updateCameraStream();
            }
          });

          conn.on('open', () => {
            const call = peer.call(conn.peer, localStream);
            call.on('stream', (officeAudio) => {
              const audioTag = document.getElementById('officeAudioSpeaker');
              audioTag.srcObject = officeAudio;
              audioTag.play();
            });
          });
        });

      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    async function updateCameraStream() {
      const statusEl = document.getElementById('systemMsg');
      try {
        const newStream = await navigator.mediaDevices.getUserMedia(getConstraints(currentFacing, currentQuality));
        const newVideoTrack = newStream.getVideoTracks()[0];
        
        if (peer) {
          for (let callId in peer.connections) {
            const connArr = peer.connections[callId];
            connArr.forEach(c => {
              if (c.peerConnection) {
                const sender = c.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) sender.replaceTrack(newVideoTrack);
              }
            });
          }
        }

        localStream.getVideoTracks()[0].stop();
        localStream.removeTrack(localStream.getVideoTracks()[0]);
        localStream.addTrack(newVideoTrack);
        document.getElementById('liveVideo').srcObject = localStream;
        statusEl.textContent = `Quality switched: ${currentQuality}p`;
      } catch (e) {
        statusEl.textContent = "Stream update error: " + e.message;
      }
    }

    function initAIPlayback() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) return;

      const lang = document.getElementById('speechLang').value;
      recognition = new Speech();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = lang;

      recognition.onresult = (event) => {
        let text = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          text += event.results[i][0].transcript;
        }
        if (text.trim() && dataChannel && dataChannel.open) {
          dataChannel.send({ type: 'subtitle', text: text });
        }
      };

      recognition.onerror = () => {};
      recognition.onend = () => {
        if (localStream) {
          try { recognition.start(); } catch(e){}
        }
      };

      try { recognition.start(); } catch(e){}
    }

    // ==========================================
    // OFFICE COMMAND VIEWER
    // ==========================================
    async function connectViewer() {
      const key = document.getElementById('secretKey').value.trim();
      const statusEl = document.getElementById('systemMsg');
      const video = document.getElementById('liveVideo');
      const hud = document.getElementById('hudStatus');

      statusEl.textContent = "Connecting to PRScam P2P...";
      try {
        officeMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        officeMicStream.getAudioTracks()[0].enabled = false;
      } catch (e) {}

      if (peer) peer.destroy();
      peer = new Peer(peerConfig);

      peer.on('open', () => {
        hud.textContent = "DIALING";
        dataChannel = peer.connect(key);

        dataChannel.on('open', () => {
          hud.textContent = "SECURE P2P LIVE";
          hud.style.color = "var(--cyan)";
          statusEl.textContent = "🟢 Live Stream & Thermal Guard Active";

          dataChannel.on('data', (msg) => {
            if (msg.type === 'subtitle') {
              displaySubtitle(msg.text);
            }
          });
        });

        peer.on('call', (call) => {
          call.answer(officeMicStream);
          call.on('stream', (stream) => {
            video.srcObject = stream;
            video.play();
            setTimeout(() => {
              document.getElementById('statRes').textContent = `${video.videoWidth}x${video.videoHeight}`;
            }, 1000);
          });
        });
      });

      peer.on('error', (err) => {
        statusEl.textContent = `Peer Error: ${err.type || err}`;
        hud.textContent = "ERROR";
      });
    }

    function displaySubtitle(text) {
      const ticker = document.getElementById('ccTicker');
      ticker.textContent = "💬 " + text;
      ticker.classList.remove('hidden');

      clearTimeout(ccTimeout);
      ccTimeout = setTimeout(() => {
        ticker.classList.add('hidden');
      }, 5000);
    }

    function remoteFlipCamera() {
      if (dataChannel && dataChannel.open) {
        dataChannel.send({ type: 'remote_flip' });
        document.getElementById('systemMsg').textContent = "Flipping home lens...";
      } else alert("Live feed not connected!");
    }

    function remoteChangeQuality(val) {
      if (dataChannel && dataChannel.open) {
        dataChannel.send({ type: 'remote_quality', quality: val });
        document.getElementById('systemMsg').textContent = `Switching to ${val}p profile...`;
        document.getElementById('statRes').textContent = `${val.toUpperCase()}P`;
      } else alert("Live feed not connected!");
    }

    // ==========================================
    // 100x ZOOM & PAN ENGINE
    // ==========================================
    function applyTransform() {
      const video = document.getElementById('liveVideo');
      video.style.transform = `scale(${zoomLevel}) translate(${panX}px, ${panY}px)`;
    }

    function setZoom(val) {
      zoomLevel = Math.max(1, Math.min(100, parseFloat(val)));
      if (zoomLevel === 1) { panX = 0; panY = 0; }
      document.getElementById('zoomSlider').value = zoomLevel;
      document.getElementById('zoomReadout').textContent = zoomLevel.toFixed(1) + 'x';
      document.getElementById('statZoom').textContent = zoomLevel.toFixed(1) + 'x';
      applyTransform();
    }

    const stage = document.getElementById('stageViewport');
    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const step = zoomLevel >= 10 ? 2 : 0.5;
      const delta = e.deltaY < 0 ? step : -step;
      setZoom(zoomLevel + delta);
    }, { passive: false });

    stage.addEventListener('mousedown', (e) => {
      if (zoomLevel <= 1) return;
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // ==========================================
    // ZOOMED SNAPSHOT & RECORDING
    // ==========================================
    function renderZoomedCanvas() {
      const video = document.getElementById('liveVideo');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(zoomLevel, zoomLevel);
      ctx.translate(panX * (canvas.width / stage.clientWidth), panY * (canvas.height / stage.clientHeight));
      ctx.drawImage(video, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
      ctx.restore();
      return canvas;
    }

    function captureZoomedSnapshot() {
      const video = document.getElementById('liveVideo');
      if (!video.videoWidth) return alert("No active video feed!");
      
      const canvas = renderZoomedCanvas();
      const link = document.createElement('a');
      link.download = `PRScam_ZoomedSnap_${zoomLevel.toFixed(0)}x_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function toggleRecording() {
      const video = document.getElementById('liveVideo');
      const btn = document.getElementById('recBtn');
      const badge = document.getElementById('recBadge');

      if (!video.srcObject) return alert("Connect live feed first!");

      if (!isRecording) {
        recordedBlobs = [];
        let options = { mimeType: 'video/webm;codecs=vp8,opus' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/mp4' };

        try { mediaRecorder = new MediaRecorder(video.srcObject, options); }
        catch (e) { return alert("Record error: " + e.message); }

        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedBlobs.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedBlobs, { type: mediaRecorder.mimeType || 'video/mp4' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `PRScam_Recording_${Date.now()}.mp4`;
          a.click();
        };

        mediaRecorder.start(1000);
        isRecording = true;
        btn.textContent = "⏹️ Stop";
        badge.classList.remove('hidden');

        recSeconds = 0;
        recTimerInt = setInterval(() => {
          recSeconds++;
          const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
          const s = String(recSeconds % 60).padStart(2, '0');
          document.getElementById('recTimer').textContent = `${m}:${s}`;
        }, 1000);

      } else {
        mediaRecorder.stop();
        isRecording = false;
        clearInterval(recTimerInt);
        btn.textContent = "🔴 Record";
        badge.classList.add('hidden');
      }
    }

    function toggleHear() {
      const video = document.getElementById('liveVideo');
      isHearActive = !isHearActive;
      video.muted = !isHearActive;
      document.getElementById('muteHearBtn').textContent = isHearActive ? "🔊 Hear: ON" : "🔇 Hear: OFF";
    }

    function toggleTalk() {
      const btn = document.getElementById('talkBtn');
      if (!officeMicStream) return alert("Microphone not detected.");
      isTalkActive = !isTalkActive;
      officeMicStream.getAudioTracks()[0].enabled = isTalkActive;
      btn.textContent = isTalkActive ? "📢 Talk: LIVE" : "🎙️ Talk: OFF";
      btn.classList.toggle('accent', isTalkActive);
    }

    function toggleFullscreen() {
      const el = document.getElementById('stageViewport');
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
