<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070a10" />
  <title>PRScam • Pro Surveillance System</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #070a10;
      --card-bg: rgba(18, 25, 40, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #00f5ff;
      --cyan-glow: 0 0 16px rgba(0, 245, 255, 0.35);
      --emerald: #00e676;
      --emerald-glow: 0 0 16px rgba(0, 230, 118, 0.35);
      --danger: #ff1744;
      --danger-glow: 0 0 16px rgba(255, 23, 68, 0.35);
      --warning: #ffab00;
      --text: #ffffff;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background: #070a10;
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ========================================================
       DESKTOP & LAPTOP INTERFACE (Widescreen Zero-Scroll)
       ======================================================== */
    @media (min-width: 900px) {
      body {
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
        padding: 12px 18px;
      }
      .app-shell {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .top-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 16px;
        margin-bottom: 10px;
      }
      .main-stage {
        flex: 1;
        min-height: 0;
      }
      .controls-dock {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 16px;
        margin-top: 10px;
      }
      .action-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
    }

    /* ========================================================
       MOBILE NATIVE APP INTERFACE (< 900px)
       ======================================================== */
    @media (max-width: 899px) {
      body {
        height: auto;
        overflow-y: auto;
        padding: 10px;
        background: #05070c;
      }
      .app-shell {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .top-nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: rgba(18, 25, 40, 0.95);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px;
      }
      .brand-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }
      .telemetry-row {
        display: grid !important;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        width: 100%;
      }
      .telemetry-row .pill {
        justify-content: center;
        font-size: 0.7rem;
        padding: 6px;
      }
      .header-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      .header-controls input {
        width: 100% !important;
      }
      .mode-toggle {
        width: 100%;
      }
      .mode-toggle button {
        flex: 1;
        padding: 11px;
        font-size: 0.85rem;
      }
      .main-stage {
        height: 48vh;
        min-height: 250px;
        border-radius: 16px;
      }
      .controls-dock {
        background: rgba(18, 25, 40, 0.95);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .action-row {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        width: 100%;
      }
      .btn-app {
        width: 100%;
        padding: 14px 10px;
        font-size: 0.85rem;
      }
      select.app-select {
        width: 100%;
        padding: 13px 10px;
        font-size: 0.85rem;
      }
      .zoom-deck {
        flex-wrap: wrap;
      }
    }

    /* ========================================================
       PREMIUM SHARED COMPONENTS
       ======================================================== */
    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--emerald);
      box-shadow: var(--emerald-glow); animation: livePulse 2s infinite;
    }
    @keyframes livePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }

    .pill {
      background: rgba(0,0,0,0.45);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-family: monospace;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pill b { color: var(--cyan); }

    .mode-toggle {
      display: flex;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }
    .mode-toggle button {
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-toggle button.active {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #fff;
      box-shadow: 0 2px 10px rgba(37,99,235,0.4);
    }

    /* VIEWPORT STAGE */
    .main-stage {
      position: relative;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center center;
      cursor: grab;
    }
    .video-canvas:active { cursor: grabbing; }

    .hud-osd {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10; pointer-events: none;
    }
    .badge {
      background: rgba(7, 10, 16, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-family: monospace;
    }
    .rec-box { color: var(--danger); font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .rec-circle { width: 7px; height: 7px; background: var(--danger); border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .cc-banner {
      position: absolute; bottom: 12px; left: 10px; right: 10px;
      background: rgba(7, 10, 16, 0.92); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 240, 0, 0.35); padding: 8px 14px;
      border-radius: 10px; color: #ffe600; font-size: 0.88rem; font-weight: 700;
      text-align: center; z-index: 15; pointer-events: none;
    }

    /* BUTTONS & SELECTS */
    .btn-app {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 15px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.06); color: #fff; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .btn-app:active { transform: scale(0.97); }
    .btn-cyan { background: linear-gradient(135deg, #00f5ff, #0099ff); color: #000; font-weight: 800; border: none; box-shadow: var(--cyan-glow); }
    .btn-emerald { background: linear-gradient(135deg, #00e676, #00b34d); color: #000; font-weight: 800; border: none; box-shadow: var(--emerald-glow); }
    .btn-danger { background: linear-gradient(135deg, #ff1744, #d50000); border: none; box-shadow: var(--danger-glow); }
    .btn-muted { background: rgba(255,255,255,0.08); border: 1px solid var(--border); }

    select.app-select {
      background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--border);
      padding: 9px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; outline: none; cursor: pointer;
    }

    .zoom-deck {
      display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.4);
      padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border); width: 100%;
    }
    .zoom-deck input[type=range] { flex: 1; accent-color: var(--cyan); cursor: pointer; }
    .zoom-pill {
      background: rgba(255,255,255,0.08); border: 1px solid var(--border);
      color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
    }
    .zoom-pill:hover { color: var(--cyan); border-color: var(--cyan); }

    /* PITCH BLACK FULLSCREEN */
    #stealthCover {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000 !important; z-index: 2147483647; display: flex;
      flex-direction: column; align-items: center; justify-content: flex-end;
      padding-bottom: 30px; cursor: pointer;
    }
    #stealthCover p { color: #1e1e1e; font-size: 0.8rem; user-select: none; }
    .hidden { display: none !important; }

    .main-stage:fullscreen { width: 100vw; height: 100vh; border-radius: 0; border: none; }
  </style>
</head>
<body>

  <!-- PITCH BLACK FULLSCREEN -->
  <div id="stealthCover" class="hidden" onclick="exitStealth()">
    <p>⚡ PRScam Stealth Active • Tap anywhere to wake</p>
  </div>

  <div class="app-shell">
    
    <!-- TOP NAVIGATION -->
    <div class="top-nav">
      <div class="brand-row">
        <div class="brand-title"><span class="pulse-dot"></span> PRScam</div>
        <div class="telemetry-row">
          <span class="pill">FEED: <b id="statRes">360p ECO</b></span>
          <span class="pill">ZOOM: <b id="statZoom">1.0x</b></span>
          <span class="pill">TIME: <b id="statClock">00:00</b></span>
        </div>
      </div>

      <div class="header-controls">
        <input type="text" id="secretKey" value="prs-secure-cam-782" style="background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; color:#fff; font-size: 0.82rem; width: 160px;" placeholder="Secret Key" />
        <div class="mode-toggle">
          <button id="tabCam" onclick="switchMode('camera')">📱 Home Phone</button>
          <button class="active" id="tabView" onclick="switchMode('viewer')">💻 Office Command</button>
        </div>
      </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div class="main-stage" id="stageViewport" ondblclick="toggleFullscreen()">
      <div class="hud-osd">
        <span class="badge" id="hudStatus">STANDBY</span>
        <span class="badge hidden rec-box" id="recBadge"><span class="rec-circle"></span> REC <span id="recTimer">00:00</span></span>
      </div>

      <div class="cc-banner hidden" id="ccBanner">💬 Listening for speech...</div>
      <video class="video-canvas" id="liveVideo" autoplay playsinline></video>
    </div>

    <!-- BOTTOM CONTROLS DOCK -->
    <div class="controls-dock">
      
      <!-- ZOOM DECK -->
      <div class="zoom-deck">
        <span style="font-size: 0.75rem; font-weight: 800; min-width: 65px; color:var(--cyan);">🔍 <span id="zoomReadout">1.0x</span></span>
        <button class="zoom-pill" onclick="setZoom(1)">1x</button>
        <button class="zoom-pill" onclick="setZoom(5)">5x</button>
        <button class="zoom-pill" onclick="setZoom(10)">10x</button>
        <button class="zoom-pill" onclick="setZoom(25)">25x</button>
        <button class="zoom-pill" onclick="setZoom(50)">50x</button>
        <button class="zoom-pill" onclick="setZoom(100)">100x</button>
        <input type="range" id="zoomSlider" min="1" max="100" step="0.5" value="1" oninput="setZoom(this.value)" />
      </div>

      <!-- OFFICE VIEWER BUTTONS -->
      <div class="action-row" id="viewerActions">
        <button class="btn-app btn-cyan" onclick="connectViewer()">⚡ Connect Live</button>
        <button class="btn-app btn-danger" id="recBtn" onclick="toggleRecording()">🔴 Record</button>
        <button class="btn-app btn-muted" onclick="captureZoomedSnapshot()">📸 Zoom Snap</button>
        <button class="btn-app btn-muted" id="muteHearBtn" onclick="toggleHear()">🔊 Hear: ON</button>
        
        <!-- HARDWARE TALK TOGGLE (DEFAULT OFF & MUTED) -->
        <button class="btn-app btn-muted" id="talkBtn" onclick="toggleTalk()">🎙️ Speak: OFF</button>
        
        <button class="btn-app btn-muted" onclick="remoteFlipCamera()">🔄 Flip Lens</button>
        
        <select class="app-select" id="remoteResSelect" onchange="remoteChangeQuality(this.value)">
          <optgroup label="❄️ Thermal Guard (Phone Cool Rahega)">
            <option value="240">240p (Zero-Heat)</option>
            <option value="360" selected>360p (Battery Saver)</option>
            <option value="480">480p (SD Balanced)</option>
          </optgroup>
          <optgroup label="🔥 Ultra Clarity (Inspect)">
            <option value="720">720p HD</option>
            <option value="1080">1080p Full HD</option>
            <option value="4k">4K UHD (3840x2160)</option>
            <option value="8k">8K Cinema (7680x4320)</option>
          </optgroup>
        </select>

        <button class="btn-app btn-muted" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      </div>

      <!-- PHONE BROADCASTER BUTTONS -->
      <div class="action-row hidden" id="cameraActions">
        <select class="app-select" id="phoneFacing">
          <option value="environment">Back Camera (Main)</option>
          <option value="user">Front Camera</option>
        </select>
        
        <select class="app-select" id="initialQuality">
          <option value="360" selected>❄️ 360p (Cool Mode)</option>
          <option value="240">❄️ 240p (Zero-Heat)</option>
          <option value="480">480p (Standard)</option>
          <option value="720">720p (HD)</option>
          <option value="1080">1080p (Full HD)</option>
          <option value="4k">4K UHD (If Supported)</option>
          <option value="8k">8K Cinema (If Supported)</option>
        </select>

        <select class="app-select" id="speechLang">
          <option value="hi-IN" selected>Hindi (हिन्दी STT)</option>
          <option value="en-IN">English (India)</option>
          <option value="en-US">English (US)</option>
        </select>

        <button class="btn-app btn-emerald" onclick="startBroadcasting()">🚀 Start Camera</button>
        
        <!-- PHONE MIC MUTE BUTTON -->
        <button class="btn-app btn-muted" id="phoneMicBtn" onclick="togglePhoneMic()">🎙️ Phone Mic: ON</button>
        
        <button class="btn-app btn-muted" onclick="enterStealth()">🔋 100% Black Screen</button>
      </div>

      <div style="font-size: 0.75rem; color: var(--text-dim); text-align: center; width: 100%;" id="systemMsg">Ready</div>
    </div>
  </div>

  <!-- INCOMING AUDIO (DEFAULT MUTED TO PREVENT LEAKAGE) -->
  <audio id="officeAudioSpeaker" autoplay muted></audio>

  <script>
    setInterval(() => {
      document.getElementById('statClock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }, 1000);

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
        ]
      }
    };

    let peer = null;
    let localStream = null;
    let officeMicStream = null;
    let dataChannel = null;

    let phoneMicActive = true;
    let isHearActive = true;
    let isTalkActive = false;

    let zoomLevel = 1.0;
    let panX = 0, panY = 0;
    let isDragging = false;
    let startX, startY;

    let mediaRecorder = null;
    let recordedBlobs = [];
    let isRecording = false;
    let recTimerInt = null;
    let recSeconds = 0;

    let recognition = null;
    let ccTimeout = null;

    let currentFacing = 'environment';
    let currentQuality = '360';

    function switchMode(mode) {
      const isCam = mode === 'camera';
      document.getElementById('tabCam').classList.toggle('active', isCam);
      document.getElementById('tabView').classList.toggle('active', !isCam);
      document.getElementById('cameraActions').classList.toggle('hidden', !isCam);
      document.getElementById('viewerActions').classList.toggle('hidden', isCam);
    }

    async function enterStealth() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
      } catch (e) {}

      document.getElementById('liveVideo').style.visibility = 'hidden';
      document.getElementById('stealthCover').classList.remove('hidden');
    }

    async function exitStealth() {
      try {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
      } catch (e) {}
      
      document.getElementById('liveVideo').style.visibility = 'visible';
      document.getElementById('stealthCover').classList.add('hidden');
    }

    function getConstraints(facing, quality) {
      let width = 640, height = 360, fps = 15;

      if (quality === '240') { width = 426; height = 240; fps = 15; }
      else if (quality === '360') { width = 640; height = 360; fps = 15; }
      else if (quality === '480') { width = 854; height = 480; fps = 20; }
      else if (quality === '720') { width = 1280; height = 720; fps = 24; }
      else if (quality === '1080') { width = 1920; height = 1080; fps = 30; }
      else if (quality === '4k') { width = 3840; height = 2160; fps = 30; }
      else if (quality === '8k') { width = 7680; height = 4320; fps = 30; }

      return {
        video: {
          facingMode: facing,
          width: { ideal: width },
          height: { ideal: height },
          frameRate: { ideal: fps, max: fps }
        },
        audio: { echoCancellation: true, noiseSuppression: true }
      };
    }

    // ==========================================
    // 1. HOME PHONE BROADCASTER
    // ==========================================
    async function startBroadcasting() {
      const key = document.getElementById('secretKey').value.trim();
      const statusEl = document.getElementById('systemMsg');
      currentFacing = document.getElementById('phoneFacing').value;
      currentQuality = document.getElementById('initialQuality').value;

      statusEl.textContent = `Booting ${currentQuality.toUpperCase()} Camera...`;
      try {
        localStream = await navigator.mediaDevices.getUserMedia(getConstraints(currentFacing, currentQuality));
        
        const video = document.getElementById('liveVideo');
        video.srcObject = localStream;

        if ('wakeLock' in navigator) {
          try { await navigator.wakeLock.request('screen'); } catch(e){}
        }

        initAIPlayback();

        if (peer) peer.destroy();
        peer = new Peer(key, peerConfig);

        peer.on('open', () => {
          statusEl.textContent = `🟢 Live! Tap 100% Black Screen and place phone.`;
          document.getElementById('hudStatus').textContent = `LIVE (${currentQuality.toUpperCase()})`;
        });

        peer.on('connection', (conn) => {
          dataChannel = conn;
          statusEl.textContent = "🔵 Office Connected!";
          
          conn.on('data', async (cmd) => {
            if (cmd.type === 'remote_flip') {
              currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
              await updateCameraStream();
            } else if (cmd.type === 'remote_quality') {
              currentQuality = cmd.quality;
              await updateCameraStream();
            } else if (cmd.type === 'laptop_mic_state') {
              // DUAL LAYER AUDIO MUTE: Phone un-mutes speaker ONLY when laptop is actively speaking!
              const speaker = document.getElementById('officeAudioSpeaker');
              speaker.muted = !cmd.active;
            }
          });

          conn.on('open', () => {
            const call = peer.call(conn.peer, localStream);
            call.on('stream', (officeAudio) => {
              const audioTag = document.getElementById('officeAudioSpeaker');
              audioTag.srcObject = officeAudio;
              audioTag.muted = true; // Stay strictly muted until command received!
              audioTag.play();
            });
          });
        });

      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    // PHONE MIC MUTE TOGGLE
    function togglePhoneMic() {
      if (!localStream) return;
      phoneMicActive = !phoneMicActive;
      localStream.getAudioTracks().forEach(t => t.enabled = phoneMicActive);
      const btn = document.getElementById('phoneMicBtn');
      btn.textContent = phoneMicActive ? "🎙️ Phone Mic: ON" : "🔇 Phone Mic: MUTED";
      btn.classList.toggle('btn-danger', !phoneMicActive);
    }

    async function updateCameraStream() {
      const statusEl = document.getElementById('systemMsg');
      try {
        const newStream = await navigator.mediaDevices.getUserMedia(getConstraints(currentFacing, currentQuality));
        const newVideoTrack = newStream.getVideoTracks()[0];
        
        if (peer) {
          for (let callId in peer.connections) {
            const connArr = peer.connections[callId];
            connArr.forEach(c => {
              if (c.peerConnection) {
                const sender = c.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) sender.replaceTrack(newVideoTrack);
              }
            });
          }
        }

        localStream.getVideoTracks()[0].stop();
        localStream.removeTrack(localStream.getVideoTracks()[0]);
        localStream.addTrack(newVideoTrack);
        document.getElementById('liveVideo').srcObject = localStream;
        statusEl.textContent = `Quality switched: ${currentQuality.toUpperCase()}`;
      } catch (e) {
        statusEl.textContent = "Switch error: " + e.message;
      }
    }

    function initAIPlayback() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) return;

      const lang = document.getElementById('speechLang').value;
      recognition = new Speech();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = lang;

      recognition.onresult = (event) => {
        let text = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          text += event.results[i][0].transcript;
        }
        if (text.trim() && dataChannel && dataChannel.open) {
          dataChannel.send({ type: 'subtitle', text: text });
        }
      };

      recognition.onerror = () => {};
      recognition.onend = () => {
        if (localStream) {
          try { recognition.start(); } catch(e){}
        }
      };

      try { recognition.start(); } catch(e){}
    }

    // ==========================================
    // 2. OFFICE COMMAND VIEWER
    // ==========================================
    async function connectViewer() {
      const key = document.getElementById('secretKey').value.trim();
      const statusEl = document.getElementById('systemMsg');
      const video = document.getElementById('liveVideo');
      const hud = document.getElementById('hudStatus');

      statusEl.textContent = "Connecting to P2P...";
      try {
        officeMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // HARD MUTE BY DEFAULT ON STARTUP
        officeMicStream.getAudioTracks().forEach(t => t.enabled = false);
      } catch (e) {}

      if (peer) peer.destroy();
      peer = new Peer(peerConfig);

      peer.on('open', () => {
        hud.textContent = "DIALING";
        dataChannel = peer.connect(key);

        dataChannel.on('open', () => {
          hud.textContent = "SECURE P2P LIVE";
          hud.style.color = "var(--cyan)";
          statusEl.textContent = "🟢 Live Stream Connected";

          // Send initial hard mute state to home phone
          dataChannel.send({ type: 'laptop_mic_state', active: false });

          dataChannel.on('data', (msg) => {
            if (msg.type === 'subtitle') displaySubtitle(msg.text);
          });
        });

        peer.on('call', (call) => {
          call.answer(officeMicStream);
          call.on('stream', (stream) => {
            video.srcObject = stream;
            video.play();
            setTimeout(() => {
              const resText = `${video.videoWidth}x${video.videoHeight}`;
              document.getElementById('statRes').textContent = resText;
              // Detect if true 4K
              if (video.videoWidth >= 3840) {
                document.getElementById('statRes').innerHTML = `<span style="color:var(--emerald)">4K (${resText})</span>`;
              }
            }, 1000);
          });
        });
      });

      peer.on('error', (err) => {
        statusEl.textContent = `Peer Error: ${err.type || err}`;
        hud.textContent = "ERROR";
      });
    }

    function displaySubtitle(text) {
      const banner = document.getElementById('ccBanner');
      banner.textContent = "💬 " + text;
      banner.classList.remove('hidden');

      clearTimeout(ccTimeout);
      ccTimeout = setTimeout(() => banner.classList.add('hidden'), 5000);
    }

    function remoteFlipCamera() {
      if (dataChannel && dataChannel.open) {
        dataChannel.send({ type: 'remote_flip' });
        document.getElementById('systemMsg').textContent = "Flipping lens...";
      } else alert("Live feed not connected!");
    }

    function remoteChangeQuality(val) {
      if (dataChannel && dataChannel.open) {
        dataChannel.send({ type: 'remote_quality', quality: val });
        document.getElementById('systemMsg').textContent = `Requesting ${val.toUpperCase()}...`;
      } else alert("Live feed not connected!");
    }

    // ==========================================
    // BULLETPROOF TWO-WAY AUDIO CONTROLS
    // ==========================================
    function toggleHear() {
      const video = document.getElementById('liveVideo');
      isHearActive = !isHearActive;
      video.muted = !isHearActive;
      const btn = document.getElementById('muteHearBtn');
      btn.textContent = isHearActive ? "🔊 Hear: ON" : "🔇 Hear: OFF";
      btn.classList.toggle('btn-danger', !isHearActive);
    }

    function toggleTalk() {
      const btn = document.getElementById('talkBtn');
      if (!officeMicStream) return alert("Microphone not detected.");

      isTalkActive = !isTalkActive;

      // 1. Enable/Disable Laptop Hardware Track
      officeMicStream.getAudioTracks().forEach(t => t.enabled = isTalkActive);

      // 2. Send Command to Phone to Unmute/Mute Speaker
      if (dataChannel && dataChannel.open) {
        dataChannel.send({ type: 'laptop_mic_state', active: isTalkActive });
      }

      if (isTalkActive) {
        btn.textContent = "📢 Speak: LIVE";
        btn.classList.remove('btn-muted');
        btn.classList.add('btn-cyan');
      } else {
        btn.textContent = "🎙️ Speak: OFF";
        btn.classList.remove('btn-cyan');
        btn.classList.add('btn-muted');
      }
    }

    // ==========================================
    // 100x ZOOM & PAN ENGINE
    // ==========================================
    function applyTransform() {
      const video = document.getElementById('liveVideo');
      video.style.transform = `scale(${zoomLevel}) translate(${panX}px, ${panY}px)`;
    }

    function setZoom(val) {
      zoomLevel = Math.max(1, Math.min(100, parseFloat(val)));
      if (zoomLevel === 1) { panX = 0; panY = 0; }
      document.getElementById('zoomSlider').value = zoomLevel;
      document.getElementById('zoomReadout').textContent = zoomLevel.toFixed(1) + 'x';
      document.getElementById('statZoom').textContent = zoomLevel.toFixed(1) + 'x';
      applyTransform();
    }

    const stage = document.getElementById('stageViewport');
    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const step = zoomLevel >= 10 ? 2 : 0.5;
      const delta = e.deltaY < 0 ? step : -step;
      setZoom(zoomLevel + delta);
    }, { passive: false });

    function handleDragStart(x, y) {
      if (zoomLevel <= 1) return;
      isDragging = true;
      startX = x - panX;
      startY = y - panY;
    }

    function handleDragMove(x, y) {
      if (!isDragging) return;
      panX = x - startX;
      panY = y - startY;
      applyTransform();
    }

    stage.addEventListener('mousedown', (e) => handleDragStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => handleDragMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', () => { isDragging = false; });

    stage.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) handleDragStart(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) handleDragMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchend', () => { isDragging = false; });

    // ==========================================
    // ZOOMED SNAPSHOT & RECORDING
    // ==========================================
    function renderZoomedCanvas() {
      const video = document.getElementById('liveVideo');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(zoomLevel, zoomLevel);
      ctx.translate(panX * (canvas.width / stage.clientWidth), panY * (canvas.height / stage.clientHeight));
      ctx.drawImage(video, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
      ctx.restore();
      return canvas;
    }

    function captureZoomedSnapshot() {
      const video = document.getElementById('liveVideo');
      if (!video.videoWidth) return alert("No active video feed!");
      
      const canvas = renderZoomedCanvas();
      const link = document.createElement('a');
      link.download = `PRScam_ZoomedSnap_${zoomLevel.toFixed(0)}x_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function toggleRecording() {
      const video = document.getElementById('liveVideo');
      const btn = document.getElementById('recBtn');
      const badge = document.getElementById('recBadge');

      if (!video.srcObject) return alert("Connect live feed first!");

      if (!isRecording) {
        recordedBlobs = [];
        let streamToRecord = video.srcObject;

        let options = { mimeType: 'video/webm;codecs=vp8,opus' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/mp4' };

        try { mediaRecorder = new MediaRecorder(streamToRecord, options); }
        catch (e) { return alert("Record error: " + e.message); }

        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedBlobs.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedBlobs, { type: mediaRecorder.mimeType || 'video/mp4' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `PRScam_Recording_${Date.now()}.mp4`;
          a.click();
        };

        mediaRecorder.start(1000);
        isRecording = true;
        btn.textContent = "⏹️ Stop";
        badge.classList.remove('hidden');

        recSeconds = 0;
        recTimerInt = setInterval(() => {
          recSeconds++;
          const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
          const s = String(recSeconds % 60).padStart(2, '0');
          document.getElementById('recTimer').textContent = `${m}:${s}`;
        }, 1000);

      } else {
        mediaRecorder.stop();
        isRecording = false;
        clearInterval(recTimerInt);
        btn.textContent = "🔴 Record";
        badge.classList.add('hidden');
      }
    }

    function toggleFullscreen() {
      const el = document.getElementById('stageViewport');
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
