<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AegisCam Pro • Enterprise Surveillance</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #06080d;
      --card-bg: rgba(13, 17, 26, 0.82);
      --card-border: rgba(255, 255, 255, 0.07);
      --cyan: #00f2fe;
      --primary: #2563eb;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.2rem; }

    .command-center {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 1.6rem;
      width: 100%;
      max-width: 820px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 242, 254, 0.03);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .brand { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff 40%, var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .radar-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; display: inline-block; box-shadow: 0 0 12px var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }

    .tabs { display: flex; background: rgba(0, 0, 0, 0.45); padding: 5px; border-radius: 14px; margin-bottom: 1.4rem; border: 1px solid var(--card-border); }
    .tab-btn { flex: 1; padding: 11px; border: none; border-radius: 10px; background: transparent; color: var(--text-muted); cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.25s ease; }
    .tab-btn.active { background: linear-gradient(135deg, #1d4ed8, #2563eb); color: #fff; box-shadow: 0 4px 18px rgba(37, 99, 235, 0.4); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; }
    input, select { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.35); color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: var(--cyan); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: all 0.2s; }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-block { width: 100%; margin-bottom: 8px; }
    .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35); }
    .btn-accent { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    .btn-glass { background: rgba(255,255,255,0.06); color: #e2e8f0; border: 1px solid var(--card-border); }
    .btn-glass:hover { background: rgba(255,255,255,0.12); }
    .btn-stealth { background: #000; border: 1px solid #222; color: #888; }

    /* CCTV VIEWPORT CONTAINER */
    .viewport {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      margin-top: 1rem;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--card-border);
      cursor: grab;
      user-select: none;
    }
    .viewport:active { cursor: grabbing; }

    /* FULLSCREEN VIEWPORT STYLING */
    .viewport:fullscreen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
      max-height: none;
    }

    .video-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
    }

    /* CCTV OSD & HUD OVERLAYS */
    .osd-top { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; z-index: 20; pointer-events: none; }
    .osd-badge { background: rgba(6, 8, 13, 0.75); backdrop-filter: blur(10px); padding: 5px 12px; border-radius: 8px; font-size: 0.75rem; font-family: monospace; border: 1px solid rgba(255,255,255,0.1); letter-spacing: 0.5px; }
    .rec-box { color: var(--danger); font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .rec-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* FLOATING SUBTITLE / CLOSED CAPTION BAR */
    .cc-overlay {
      position: absolute;
      bottom: 16px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 16px;
      border-radius: 10px;
      color: #ffeb3b;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      z-index: 25;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      transition: opacity 0.3s ease;
    }

    /* CONTROLS BAR */
    .zoom-dock {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.3);
      padding: 12px 16px;
      border-radius: 12px;
      margin-top: 12px;
      border: 1px solid var(--card-border);
    }
    .zoom-dock input[type=range] { flex: 1; accent-color: var(--cyan); cursor: pointer; }
    .quick-zoom-btn { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; background: rgba(255,255,255,0.08); border: 1px solid var(--card-border); color: #fff; cursor: pointer; }

    .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
    
    .status-alert { margin-top: 12px; font-size: 0.85rem; text-align: center; color: var(--warning); font-weight: 500; }
    .hidden { display: none !important; }

    /* PITCH BLACK FULLSCREEN (PHONE) */
    #stealthOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000 !important; z-index: 2147483647; display: flex;
      flex-direction: column; align-items: center; justify-content: flex-end;
      padding-bottom: 30px; cursor: pointer;
    }
    #stealthOverlay p { color: #1c1c1c; font-size: 0.8rem; user-select: none; }
  </style>
</head>
<body>

  <!-- 100% PITCH BLACK BATTERY SAVER -->
  <div id="stealthOverlay" class="hidden" onclick="exitStealthMode()">
    <p>⚡ Stealth Mode Active • Tap anywhere to wake screen</p>
  </div>

  <div class="command-center">
    <div class="top-bar">
      <div class="brand"><span class="radar-dot"></span> AegisCam Pro</div>
      <span class="osd-badge" id="liveClock">00:00:00</span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabCamera" onclick="switchMode('camera')">📱 Home Phone (Camera)</button>
      <button class="tab-btn" id="tabViewer" onclick="switchMode('viewer')">💻 Office Command (Viewer)</button>
    </div>

    <div class="field">
      <label>Secret Camera Key</label>
      <input type="text" id="secretKey" value="my-home-camera-782" />
    </div>

    <!-- ================= 1. HOME PHONE SECTION ================= -->
    <div id="cameraSection">
      <div class="form-row">
        <div>
          <label>Camera Lens</label>
          <select id="cameraFacing">
            <option value="environment">Back Camera (Main)</option>
            <option value="user">Front Camera (Selfie)</option>
          </select>
        </div>
        <div>
          <label>Stream Quality</label>
          <select id="streamQuality">
            <option value="1080">1080p (Full HD - High Detail)</option>
            <option value="720" selected>720p (HD - Balanced)</option>
            <option value="480">480p (SD - Smooth)</option>
            <option value="360">360p (Battery Saver)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Live AI Subtitles / Speech Language</label>
        <select id="speechLang">
          <option value="hi-IN" selected>Hindi (हिन्दी Transcripts)</option>
          <option value="en-IN">English (India)</option>
          <option value="en-US">English (US)</option>
        </select>
      </div>

      <button class="btn btn-primary btn-block" onclick="startCamera()">🚀 1. Start Camera + AI Transcriber</button>
      
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-glass btn-block hidden" id="phoneMicBtn" onclick="togglePhoneMic()">🎙️ Mic: ON</button>
        <button class="btn btn-stealth btn-block hidden" id="stealthBtn" onclick="enterStealthMode()">🔋 100% Black Screen</button>
      </div>

      <div class="status-alert" id="cameraStatus">Camera is in standby.</div>

      <div class="viewport hidden" id="previewContainer">
        <video class="video-canvas" id="localPreview" autoplay muted playsinline></video>
      </div>
      <audio id="incomingOfficeAudio" autoplay></audio>
    </div>

    <!-- ================= 2. OFFICE COMMAND SECTION ================= -->
    <div id="viewerSection" class="hidden">
      <button class="btn btn-accent btn-block" onclick="connectFromOffice()">⚡ Connect Live Feed</button>

      <!-- CCTV VIEWPORT (DOUBLE CLICK FOR FULLSCREEN) -->
      <div class="viewport" id="cctvViewport" ondblclick="toggleCinemaFullscreen()">
        <div class="osd-top">
          <span class="osd-badge" id="cctvBadge">STATUS: STANDBY</span>
          <span class="osd-badge hidden rec-box" id="recBadge"><span class="rec-dot"></span> REC <span id="recTimer">00:00</span></span>
        </div>

        <!-- Live Subtitles / Transcripts Banner -->
        <div class="cc-overlay hidden" id="subtitlesBox">💬 Live Subtitles will appear here...</div>

        <video class="video-canvas" id="remoteFeed" autoplay playsinline></video>
      </div>

      <!-- 10x ULTRA-ZOOM DOCK -->
      <div class="zoom-dock">
        <span style="font-size: 0.85rem; font-weight: 700; min-width: 85px;">🔍 Zoom: <b id="zoomLabel" style="color:var(--cyan)">1.0x</b></span>
        <button class="quick-zoom-btn" onclick="setZoom(1)">1x</button>
        <button class="quick-zoom-btn" onclick="setZoom(2)">2x</button>
        <button class="quick-zoom-btn" onclick="setZoom(5)">5x</button>
        <button class="quick-zoom-btn" onclick="setZoom(10)">10x</button>
        <input type="range" id="zoomSlider" min="1" max="10" step="0.1" value="1" oninput="setZoom(this.value)" />
      </div>

      <!-- ACTION BUTTONS -->
      <div class="action-grid">
        <button class="btn btn-danger" id="recBtn" onclick="toggleRecording()">🔴 Record</button>
        <button class="btn btn-glass" onclick="toggleCinemaFullscreen()">⛶ Fullscreen</button>
        <button class="btn btn-glass" onclick="takeSnapshot()">📸 Snapshot</button>
        <button class="btn btn-glass" id="speakerBtn" onclick="toggleHomeAudio()">🔊 Hear: ON</button>
        <button class="btn btn-glass" id="officeMicBtn" onclick="toggleOfficeMic()">🎙️ Talk: OFF</button>
      </div>

      <div class="status-alert" id="viewerStatus">Click 'Connect Live Feed' to view.</div>
    </div>
  </div>

  <script>
    // Live Clock HUD
    setInterval(() => {
      document.getElementById('liveClock').textContent = new Date().toLocaleTimeString();
    }, 1000);

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
        ]
      }
    };

    let peer = null;
    let localStream = null;
    let officeMicStream = null;
    let dataChannel = null;

    let phoneMicActive = true;
    let officeMicActive = false;
    let homeAudioActive = true;

    // Zoom & Pan State
    let zoomLevel = 1.0;
    let panX = 0, panY = 0;
    let isDragging = false;
    let startX, startY;

    // Recorder State
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recInterval = null;
    let recSecs = 0;

    // Speech Recognition State
    let recognition = null;
    let ccHideTimer = null;

    function switchMode(mode) {
      const isCamera = mode === 'camera';
      document.getElementById('tabCamera').classList.toggle('active', isCamera);
      document.getElementById('tabViewer').classList.toggle('active', !isCamera);
      document.getElementById('cameraSection').classList.toggle('hidden', !isCamera);
      document.getElementById('viewerSection').classList.toggle('hidden', isCamera);
    }

    // ==========================================
    // 100% PITCH BLACK FULLSCREEN
    // ==========================================
    async function enterStealthMode() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
      } catch (e) {}
      document.getElementById('stealthOverlay').classList.remove('hidden');
    }

    async function exitStealthMode() {
      try {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
      } catch (e) {}
      document.getElementById('stealthOverlay').classList.add('hidden');
    }

    // ==========================================
    // 1. HOME PHONE LOGIC (WITH AI SPEECH TO TEXT)
    // ==========================================
    async function startCamera() {
      const key = document.getElementById('secretKey').value.trim();
      const statusEl = document.getElementById('cameraStatus');
      const facing = document.getElementById('cameraFacing').value;
      const quality = document.getElementById('streamQuality').value;

      let res = { width: 1280, height: 720 };
      if (quality === '1080') res = { width: 1920, height: 1080 };
      if (quality === '480') res = { width: 854, height: 480 };
      if (quality === '360') res = { width: 640, height: 360 };

      statusEl.textContent = "Initializing camera & AI Speech Engine...";
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing, width: { ideal: res.width }, height: { ideal: res.height } },
          audio: { echoCancellation: true, noiseSuppression: true }
        });

        document.getElementById('localPreview').srcObject = localStream;
        document.getElementById('previewContainer').classList.remove('hidden');
        document.getElementById('phoneMicBtn').classList.remove('hidden');
        document.getElementById('stealthBtn').classList.remove('hidden');

        if ('wakeLock' in navigator) {
          try { await navigator.wakeLock.request('screen'); } catch(e){}
        }

        // Start Live AI Speech-to-Text Recognition on Phone
        initSpeechRecognition();

        if (peer) peer.destroy();
        peer = new Peer(key, peerConfig);

        peer.on('open', () => {
          statusEl.textContent = "🟢 Broadcaster Live! Tap '100% Black Screen' and relax.";
        });

        peer.on('connection', (conn) => {
          dataChannel = conn;
          statusEl.textContent = "🔵 Office Connected! Pushing live feed + subtitles...";
          conn.on('open', () => {
            const call = peer.call(conn.peer, localStream);
            call.on('stream', (officeAudio) => {
              const audioTag = document.getElementById('incomingOfficeAudio');
              audioTag.srcObject = officeAudio;
              audioTag.play();
            });
          });
        });

        peer.on('error', (err) => { statusEl.textContent = `Error: ${err.type || err}`; });
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    // AI Speech-to-Text via Web Speech API
    function initSpeechRecognition() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) return console.warn("Web Speech API not supported on this browser.");

      const lang = document.getElementById('speechLang').value;
      recognition = new Speech();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = lang;

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        // Send transcript to office
        if (dataChannel && dataChannel.open && transcript.trim()) {
          dataChannel.send({ type: 'transcript', text: transcript });
        }
      };

      recognition.onend = () => {
        // Auto restart speech listener
        if (localStream) recognition.start();
      };

      try { recognition.start(); } catch(e){}
    }

    function togglePhoneMic() {
      if (!localStream) return;
      phoneMicActive = !phoneMicActive;
      localStream.getAudioTracks().forEach(t => t.enabled = phoneMicActive);
      const btn = document.getElementById('phoneMicBtn');
      btn.textContent = phoneMicActive ? "🎙️ Mic: ON" : "🔇 Mic: OFF";
      btn.classList.toggle('btn-danger', !phoneMicActive);
    }

    // ==========================================
    // 2. OFFICE COMMAND LOGIC
    // ==========================================
    async function connectFromOffice() {
      const key = document.getElementById('secretKey').value.trim();
      const statusEl = document.getElementById('viewerStatus');
      const video = document.getElementById('remoteFeed');
      const badge = document.getElementById('cctvBadge');

      statusEl.textContent = "Initializing connection...";
      try {
        officeMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        officeMicStream.getAudioTracks()[0].enabled = false;
      } catch (e) {}

      if (peer) peer.destroy();
      peer = new Peer(peerConfig);

      peer.on('open', () => {
        statusEl.textContent = "Dialing Home Camera...";
        badge.textContent = "STATUS: CONNECTING";
        const conn = peer.connect(key);

        conn.on('open', () => {
          conn.on('data', (data) => {
            if (data.type === 'transcript') {
              showLiveSubtitle(data.text);
            }
          });
        });

        peer.on('call', (call) => {
          call.answer(officeMicStream);
          call.on('stream', (homeStream) => {
            statusEl.textContent = "🟢 Live Feed & AI Transcripts Active";
            badge.textContent = "STATUS: LIVE (SECURE P2P)";
            badge.style.color = "var(--cyan)";
            video.srcObject = homeStream;
            video.play();
          });
        });
      });

      peer.on('error', (err) => {
        statusEl.textContent = `Error: ${err.type || err}`;
        badge.textContent = "STATUS: ERROR";
      });
    }

    // Display Live Subtitles on Office Screen
    function showLiveSubtitle(text) {
      const box = document.getElementById('subtitlesBox');
      box.textContent = "💬 " + text;
      box.classList.remove('hidden');

      clearTimeout(ccHideTimer);
      ccHideTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 5000); // 5 sec auto hide
    }

    // ==========================================
    // 10x ULTRA ZOOM & PAN CONTROLS
    // ==========================================
    function updateTransform() {
      const video = document.getElementById('remoteFeed');
      video.style.transform = `scale(${zoomLevel}) translate(${panX}px, ${panY}px)`;
    }

    function setZoom(val) {
      zoomLevel = Math.max(1, Math.min(10, parseFloat(val)));
      if (zoomLevel === 1) { panX = 0; panY = 0; }
      document.getElementById('zoomSlider').value = zoomLevel;
      document.getElementById('zoomLabel').textContent = zoomLevel.toFixed(1) + 'x';
      updateTransform();
    }

    // Mouse Wheel Zoom
    const viewport = document.getElementById('cctvViewport');
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.25 : -0.25;
      setZoom(zoomLevel + delta);
    }, { passive: false });

    // Drag to Pan when Zoomed
    viewport.addEventListener('mousedown', (e) => {
      if (zoomLevel <= 1) return;
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // ==========================================
    // FULLSCREEN THEATER MODE
    // ==========================================
    function toggleCinemaFullscreen() {
      const vp = document.getElementById('cctvViewport');
      if (!document.fullscreenElement) {
        if (vp.requestFullscreen) vp.requestFullscreen();
        else if (vp.webkitRequestFullscreen) vp.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // ==========================================
    // RECORDING & SNAPSHOT
    // ==========================================
    function toggleRecording() {
      const video = document.getElementById('remoteFeed');
      const recBtn = document.getElementById('recBtn');
      const recBadge = document.getElementById('recBadge');

      if (!video.srcObject) return alert("Connect live feed first!");

      if (!isRecording) {
        recordedChunks = [];
        let options = { mimeType: 'video/webm;codecs=vp8,opus' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/mp4' };

        try { mediaRecorder = new MediaRecorder(video.srcObject, options); }
        catch (e) { return alert("Recording error: " + e.message); }

        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `CCTV_Record_${Date.now()}.mp4`;
          a.click();
        };

        mediaRecorder.start(1000);
        isRecording = true;
        recBtn.textContent = "⏹️ Stop";
        recBadge.classList.remove('hidden');

        recSecs = 0;
        recInterval = setInterval(() => {
          recSecs++;
          const m = String(Math.floor(recSecs / 60)).padStart(2, '0');
          const s = String(recSecs % 60).padStart(2, '0');
          document.getElementById('recTimer').textContent = `${m}:${s}`;
        }, 1000);
      } else {
        mediaRecorder.stop();
        isRecording = false;
        clearInterval(recInterval);
        recBtn.textContent = "🔴 Record";
        recBadge.classList.add('hidden');
      }
    }

    function takeSnapshot() {
      const video = document.getElementById('remoteFeed');
      if (!video.videoWidth) return alert("No video available!");
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `CCTV_Snap_${Date.now()}.png`;
      a.click();
    }

    function toggleHomeAudio() {
      const video = document.getElementById('remoteFeed');
      homeAudioActive = !homeAudioActive;
      video.muted = !homeAudioActive;
      document.getElementById('speakerBtn').textContent = homeAudioActive ? "🔊 Hear: ON" : "🔇 Hear: OFF";
    }

    function toggleOfficeMic() {
      const btn = document.getElementById('officeMicBtn');
      if (!officeMicStream) return alert("Office microphone not found.");
      officeMicActive = !officeMicActive;
      officeMicStream.getAudioTracks()[0].enabled = officeMicActive;
      btn.textContent = officeMicActive ? "📢 Talk: LIVE" : "🎙️ Talk: OFF";
      btn.classList.toggle('btn-accent', officeMicActive);
    }
  </script>
</body>
</html>
